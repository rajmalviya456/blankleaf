name: Bug report
description: Something in Blankleaf doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste private note content: a small made-up example is enough.
        Found a security problem? Please [report it privately](https://github.com/rajmalviya456/blankleaf/security/advisories/new) instead.
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Step by step, so we can do the same.
      placeholder: |
        1. Make a new note
        2. Set its format to Markdown
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 140 on macOS 15
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: How do you use Blankleaf?
      options:
        - In a browser tab
        - Installed as an app
        - On a phone
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown under About in the sidebar, if you know it.
      placeholder: 1.18.1
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, how often it happens.
