name: Feature idea
description: Suggest something Blankleaf could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the moment it would help, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: markdown
    attributes:
      value: Blankleaf has no backend and no accounts, and notes never leave the browser unencrypted. Ideas that keep those promises can ship much sooner.
