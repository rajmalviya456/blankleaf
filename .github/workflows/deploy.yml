name: Deploy

# Builds the app and publishes dist/ to the gh-pages branch (never committed to main).
# Runs when a release is cut (called from release.yml), or by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Lint, types and tests already passed on this commit (pull request + CI on main),
      # and `build` type-checks again before bundling.
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: 'deploy: ${{ github.sha }}'
