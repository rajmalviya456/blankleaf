name: Release

# On every push to main, release-please keeps a "chore(main): release x.y.z" pull request up to
# date: it picks the next semantic version from the Conventional Commits since the last release
# (fix → patch, feat → minor, BREAKING CHANGE → major) and writes CHANGELOG.md.
# Merging that pull request tags the release, publishes a GitHub Release and deploys the site.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release made with GITHUB_TOKEN can't trigger other workflows, so deploy from here.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write

  # GitHub holds CI on pull requests opened by the Actions bot until someone approves the run.
  # Approve it here, for the release pull request only, so releases need no manual step.
  release-pr-checks:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_BRANCH: release-please--branches--main--components--blankleaf
    steps:
      - name: Approve the held CI run on the release pull request
        run: |
          # The run can take a moment to appear after release-please pushes.
          for attempt in $(seq 1 18); do
            head=$(gh pr list --head "$RELEASE_BRANCH" --state open --json headRefOid --jq '.[0].headRefOid // ""')
            if [ -z "$head" ]; then exit 0; fi
            run=$(gh run list --workflow ci.yml --branch "$RELEASE_BRANCH" --commit "$head" --event pull_request \
              --json databaseId,conclusion --jq '[.[] | select(.conclusion == "action_required")][0].databaseId // ""')
            if [ -n "$run" ]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/$run/approve" || true
              exit 0
            fi
            sleep 10
          done
          echo "::warning::No held CI run found for the release pull request."
