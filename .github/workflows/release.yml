name: Release

# On every push to main, release-please keeps a "chore(main): release x.y.z" pull request up to
# date: it picks the next semantic version from the Conventional Commits since the last release
# (fix → patch, feat → minor, BREAKING CHANGE → major) and writes CHANGELOG.md.
# Merging that pull request tags the release, publishes a GitHub Release and deploys the site.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release made with GITHUB_TOKEN can't trigger other workflows, so deploy from here.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
