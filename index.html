    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Blankleaf",
        "alternateName": ["Blankleaf Online Notepad", "Notepadz"],
        "url": "https://rajmalviya456.github.io/blankleaf/",
        "description": "A free online notepad with tabs, Markdown preview, code highlighting and autosave in your browser. No sign-up, works offline, share notes by link.",
        "applicationCategory": "UtilitiesApplication",
        "applicationSubCategory": "Notepad",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript. Works in current Chrome, Edge, Firefox and Safari.",
        "image": "https://rajmalviya456.github.io/blankleaf/og-image.png",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Tabs for many notes at once",
          "Markdown with live preview",
          "Syntax highlighting for code and logs",
          "Autosave in your browser, no account",
          "Works offline as an installable app",
          "Find and replace",
          "End-to-end encrypted share by link",
          "Backup and restore",
          "Works on phones"
        ],
        "codeRepository": "https://github.com/rajmalviya456/blankleaf"
      }

    <script>
      // Set the theme before first paint, so dark mode never flashes white.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('blankleaf:theme')
        } catch (e) {}
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        // Never opened here before (nothing saved yet): the app will open the welcome note, so
        // the instant first paint shows its opening lines rather than an empty page.
        if (saved === null) document.documentElement.dataset.firstVisit = '1'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #np-shell {
        position: fixed;
        inset: 0;
        background: #fff;
        color: #5f6672;
        font:
          13px/1 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      [data-theme='dark'] #np-shell {
        background: #111318;
        color: #9096a2;
      }
      #np-shell header {
        display: flex;
        align-items: center;
        height: 36px;
        padding: 0 14px;
        background: #eef0f3;
      }
      [data-theme='dark'] #np-shell header {
        background: #0b0d10;
      }
      /* Phones: the note bar's title, at the app's size, so this paint already counts as loaded. */
      @media (max-width: 639px) {
        #np-shell header {
          height: 48px;
          padding-left: 60px;
          /* The system font is narrower than the app's Inter: drawn a touch larger to match. */
          font-size: 16px;
          letter-spacing: 0.04em;
          font-weight: 600;
        }
      }
      .np-shell-welcome,
      .np-shell-welcome-title,
      [data-first-visit] #np-shell p,
      [data-first-visit] .np-shell-untitled {
        display: none;
      }
      [data-first-visit] .np-shell-welcome-title {
        display: inline;
      }
      [data-first-visit] .np-shell-welcome {
        display: block;
        margin: 0;
        padding: 16px 18px 0 46px;
        color: #23272f;
        white-space: pre-wrap;
        font:
          14px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      [data-theme='dark'][data-first-visit] .np-shell-welcome {
        color: #e6e8ec;
      }
      @media (max-width: 639px) {
        [data-first-visit] .np-shell-welcome {
          font-size: 16px;
          padding-left: 47px;
        }
      }
      #np-shell p {
        margin: 0;
        padding: 16px 18px;
        font:
          14px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
    </style>
    <noscript
      ><style>
        #np-shell {
          display: none;
        }
      </style></noscript
    >

  <body>
    <div id="root">
      <!-- Painted straight away, and replaced by the app as soon as its code has loaded. -->
      <div id="np-shell" aria-hidden="true">
        <header>
          <span class="np-shell-untitled">Untitled</span
          ><span class="np-shell-welcome-title">Welcome</span>
        </header>
        <p>1</p>
        <pre class="np-shell-welcome">
# Welcome to Blankleaf

This is a **sample note**. Change anything, it's yours, and delete it when you're done.
Everything saves in this browser as you type. Nothing leaves your device unless you share it.
</pre>
      </div>
    </div>

        </p>
